# The fast pipeline. Its `ci` aggregator is the only required check on PRs.
#
# Pull requests get a fast signal on Ubuntu and Windows: lint, typecheck and
# sharded tests run as parallel jobs over the packages the change affects
# (scripts/ci-scope.mjs), and only the jobs whose paths changed run at all. Main
# and develop get the full pipeline on both OSes on every push; main also nightly.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  schedule:
    - cron: "41 3 * * *" # nightly, 03:41 UTC

permissions:
  contents: read

# Superseded PR runs are cancelled. Main runs are grouped by commit, so a merge
# never cancels (or replaces the pending run of) the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed, read from the API (no checkout). Every job below needs it.
  # Draft PRs run too: every PR here is opened as a draft.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      # CI or root config can change how any job behaves, so it runs them all.
      full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.full == 'true' }}
      desktop: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop == 'true' || steps.filter.outputs.full == 'true' }}
    steps:
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          # `code` is everything but docs; keep it in step with isDocs in
          # scripts/ci-scope.mjs. Markdown inside a package is package content
          # (prompts, skills), so only root *.md and changelogs count as docs.
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!.changeset/**"
              - "!*.md"
              - "!**/CHANGELOG.md"
            desktop:
              - "{apps/desktop,packages/runtime}/**"
            # One pattern: with predicate-quantifier every, a file must match
            # every pattern in a filter.
            full:
              - "{.github/**,scripts/**,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,tsconfig*.json,eslint.config.*,vitest.config.*,.prettierrc*,prettier.config.*,.prettierignore,.dependency-cruiser*,.nvmrc}"

  lint:
    name: lint (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: write # cancel the run when this fails
    steps:
      - &checkout
        name: Checkout (the merge commit and its parents)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # HEAD^1 of the merge commit is the base, so the diff is the PR's own.
          fetch-depth: 2
          # Nothing after checkout talks to the remote; keep the token out of
          # .git/config, where install scripts and lint plugins could read it.
          persist-credentials: false
      - &pnpm
        name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - &node
        name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - &install
        name: Install
        run: pnpm install --frozen-lockfile
      - &scope
        name: Affected packages
        id: scope
        run: node scripts/ci-scope.mjs HEAD^1

      - name: Lint
        if: steps.scope.outputs.none != 'true'
        run: pnpm exec eslint ${{ steps.scope.outputs.all == 'true' && '.' || steps.scope.outputs.paths }}
      - name: Format check
        run: |
          if [ "${{ steps.scope.outputs.all }}" = "true" ]; then
            pnpm format
          else
            git diff --name-only -z --diff-filter=d HEAD^1 HEAD \
              | xargs -0 -r pnpm exec prettier --check --ignore-unknown
          fi
      - name: Check module boundaries
        if: steps.scope.outputs.none != 'true'
        run: pnpm boundaries

      # Fail fast: a red lint fails the aggregator now instead of after tests.
      - &cancel
        name: Cancel the rest of the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"

  typecheck:
    name: typecheck (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: write # cancel the run when this fails
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - *scope
      - &tsc-cache
        name: Restore TypeScript build info
        if: steps.scope.outputs.none != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/*/dist
            packages/*/lib
            packages/*/.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Typecheck
        if: steps.scope.outputs.none != 'true'
        run: pnpm exec tsc --build ${{ steps.scope.outputs.tsconfigs }}
      # The desktop app is built by electron-vite, outside the tsc --build graph.
      - name: Typecheck desktop
        if: steps.scope.outputs.desktop == 'true'
        run: pnpm --filter @arynbht/rivetari-desktop typecheck
      - *cancel

  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/3)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - *scope
      - *tsc-cache
      - name: Restore vitest cache
        if: steps.scope.outputs.none != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-${{ matrix.shard }}
          restore-keys: vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Tests import the workspace packages from dist: build only those.
      - name: Build what the tests import
        if: steps.scope.outputs.none != 'true'
        run: pnpm exec tsc --build ${{ steps.scope.outputs.tsconfigs }}
      # A shard covers part of the suite, so the coverage floor is checked by
      # main's full run, not here.
      - name: Test
        if: steps.scope.outputs.none != 'true'
        run: >-
          pnpm exec vitest run ${{ steps.scope.outputs.paths }}
          --shard=${{ matrix.shard }}/3 --passWithNoTests --coverage.enabled=false

  # On a PR, gitleaks scans the PR's own commits; a push scans what it pushed.
  secret-scan:
    name: secret-scan
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the PR's commits through the API, which a private
    # repo only allows with pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks-action picks the range itself (the PR's commits, or the
          # push's); it needs their history present.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Not required on PRs: it runs when the desktop app or the runtime it drives
  # changes, and on every main run.
  desktop-e2e:
    name: desktop-e2e
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - *pnpm
      - *node
      - *install
      - name: Install Electron runtime libraries + xvfb
        run: |
          pnpm --filter @arynbht/rivetari-desktop exec playwright install-deps
          sudo apt-get install -y xvfb
      - name: Run desktop e2e (xvfb)
        # Chromium won't render on xvfb's 8-bit default, so force 24-bit.
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm --filter @arynbht/rivetari-desktop e2e

  # Main and nightly: every check on both OSes.
  build-test:
    name: build-test (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - *pnpm
      - *node
      - *install
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck desktop
        run: pnpm --filter @arynbht/rivetari-desktop typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format
      - name: Check module boundaries
        run: pnpm boundaries
      # Full suite with the coverage floor.
      - name: Test
        run: pnpm test

  # The one check a PR needs.
  # It always runs, so a job skipped by its path filter never leaves a PR
  # waiting, and it treats skipped as fine but anything else that isn't a pass
  # as a failure (GitHub counts a skipped required check as passing).
  ci:
    name: ci
    if: always() && github.event_name == 'pull_request'
    needs: [changes, lint, typecheck, test, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to pass or be skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::the changes job finished with '$CHANGES'"
            exit 1
          fi
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a required job finished with '$r'"
              exit 1
            fi
          done
